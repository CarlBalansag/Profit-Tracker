<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f1a" />
    <title>Profit Tracker</title>
    <script>
      // Apply the theme before React loads so the page never flashes.
      // Same rule as ThemeSwitch.jsx: a manual override wins, otherwise follow the OS.
      (function () {
        var theme = null;
        try {
          localStorage.removeItem('theme');
          var override = localStorage.getItem('theme-override');
          if (override === 'dark' || override === 'light') theme = override;
        } catch (e) {}
        if (!theme) {
          var dark = false;
          try {
            dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          } catch (e) {}
          theme = dark ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        // The phone's status bar matches the app's top bar, in whichever theme
        // is showing (the theme can change later from the switch or the OS).
        var bar = document.querySelector('meta[name="theme-color"]');
        var paint = function () {
          if (bar) bar.setAttribute('content', document.documentElement.dataset.theme === 'dark' ? '#0f0f1a' : '#ffffff');
        };
        paint();
        try {
          new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
