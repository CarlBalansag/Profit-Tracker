[build]
  base    = "selvora-app"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from   = "/api/*"
  to     = "https://profit-tracker-tcqo.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/auth/*"
  to     = "https://profit-tracker-tcqo.onrender.com/auth/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/health"
  to     = "https://profit-tracker-tcqo.onrender.com/health"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
